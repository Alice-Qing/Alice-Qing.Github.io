<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>awesome</title>
    <style>
       
        body {
            background-color: #f0fff4; 
            color: #333333;            
            font-family: 'Arial', sans-serif;
            margin: 0;
            text-align: center;       
        }

       
        .hero-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-title {
            font-size: 4rem;
            margin: 0;
            
            animation: slideDown 1s ease-out;
        }

        .hero-name {
            font-size: 2.5rem;
            color: #2e8b57; 
            margin-top: 20px;
           
            animation: slideDown 1s ease-out 0.5s both;
        }

        
        .content-section {
            padding: 60px 20px;
        }

        .content-section h3 {
            font-size: 1.8rem;
            margin-bottom: 30px;
        }

        .sub-text {
            font-size: 1rem;
            color: #666;
            margin-top: 10px;
        }

       
        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .image-gallery img {
            width: 300px;      
            max-width: 90%;    
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

      
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

  
    <div class="hero-section">
        <h1 class="hero-title">Hero display</h1>
        <h2 class="hero-name">张天硕</h2>
    </div>

   
    <div class="content-section">
        <h3>Ai generated images╮(￣▽￣"")╭</h3>
        <div class="image-gallery">
           
            <img src="636dadb2a1b725e7bb99f64126ad98d4.jpeg" alt="AIgenerated1">
            <img src="bcd52fa14e22097cf27a78c5cb37af74.jpeg" alt="AIgenerated2">
        </div>
    </div>

   
    <div class="content-section">
        <h3>Real images</h3>
        <p class="sub-text">much more decent(´▽｀)</p>
   <div class="image-gallery">
          
            <img src="9011fbbf2773682980ff31469a3c4ae0.jpeg" alt="Real image1">
            <img src="eb982351c54ba1561888ea66d1d06c99.jpeg" alt="Real image2">
        </div>
    </div>

</body>
</html>
